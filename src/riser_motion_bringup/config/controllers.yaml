controller_manager:
  ros__parameters:
    update_rate: 1000
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    motor_profile:
      type: riser_motion_bringup/MotionController
motor_profile:
  ros__parameters:
    jog_mode: true
    joint: bottom_motor
    profile: ramp
    # Zero target for the first servo-enabled test after bus qualification.
    speed_rad_s: 50.0
    duration_s: 50.0
    ramp_s: 5.0
    max_travel_rad: 300.0
    max_acceleration_rad_s2: 100.0
    max_period_s: 0.005
joint_state_broadcaster:
  ros__parameters: {}
