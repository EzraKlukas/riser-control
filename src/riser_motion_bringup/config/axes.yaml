# Absolute bus positions. Fill in serials and motor ratings from the machine
# before enabling additional real axes. Null entries are uncommissioned.
enabled: [bottom]
axes:
  bottom: {position: 0, alias: 0, serial: 0, rated_torque_nm: 1.3}
  top: {position: 1, alias: 0, serial: null, rated_torque_nm: null}
  torso: {position: 2, alias: 0, serial: null, rated_torque_nm: null}
  hip: {position: 3, alias: 0, serial: null, rated_torque_nm: null}
