controller_manager:
  ros__parameters:
    update_rate: 1000
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    motor_profile:
      type: riser_motion/MotionController
motor_profile:
  ros__parameters:
    jog_mode: true
    joint: bottom_motor
    profile: ramp
    # Zero target for the first servo-enabled test after bus qualification.
    speed_m_s: 0.0
    duration_s: 8.0
    ramp_s: 0.25
    max_duration_s: 60.0
    # Absolute angles from calibrated zero, used by the footplate profiles.
    footplate_lower_rad: -0.18
    footplate_upper_rad: 0.18
    max_period_s: 0.005
joint_state_broadcaster:
  ros__parameters: {}
